[package]
name = "sonic1-web"
description = "Frontend WebAssembly: camada fina entre o navegador e os crates do projeto"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# cdylib gera o .wasm; rlib permite testar em codigo nativo.
crate-type = ["cdylib", "rlib"]

[dependencies]
sonic1-rom = { path = "../rom" }
# Mesma versao do wasm-bindgen-cli da imagem (ARG WASM_BINDGEN_VERSION).
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
