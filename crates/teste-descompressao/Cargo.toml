[package]
name = "sonic1-teste-descompressao"
description = "Compressores de teste e testes dos descompressores (so dados sinteticos, nada da ROM)"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sonic1-core = { path = "../core" }

[lints]
workspace = true

# A cobertura das decisoes do nucleo so e medida quando os testes rodam (nao muda o comportamento).
[dev-dependencies]
sonic1-core = { path = "../core", features = ["cobertura", "mutacao"] }
