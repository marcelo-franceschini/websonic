# Sintetizador fiel (Etapa 8): FM (YM2612) e PSG, em inteiros, sem float.
# Escrito a partir de documentacao publica (ver docs/conhecimento/sintese.md). Nenhum codigo
# de emulador de referencia entra aqui. Os chips de referencia ficam em diferencial-sintese/.
[package]
name = "sonic1-audio"
description = "Sintetizador: FM e PSG, saida digital de cada chip na taxa dele"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

# Mesmas regras do nucleo (CLAUDE.md).
[lints.clippy]
all = { level = "warn", priority = -1 }
float_arithmetic = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
disallowed_types = "deny"
