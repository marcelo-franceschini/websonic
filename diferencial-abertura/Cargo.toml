[package]
name = "sonic1-diferencial-abertura"
description = "Comparacao da abertura (Etapa 7): o oraculo (jgenesis modificado) contra o nucleo (GPLv3, workspace proprio)"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
websonic-oracle = { path = "../oracle/runner" }
genesis-core = { path = "../target/oracle-fonte/backend/genesis-core" }
oracle-trace = { path = "../target/oracle-fonte/common/oracle-trace" }
sonic1-console = { path = "../crates/console" }
sonic1-core = { path = "../crates/core" }
sonic1-fidelidade = { path = "../crates/fidelidade" }

[lints.clippy]
all = { level = "warn", priority = -1 }

# Workspace proprio, como diferencial-som: liga o oraculo (GPLv3) ao nucleo e nunca entra no
# build do jogo nem do site.
[workspace]
