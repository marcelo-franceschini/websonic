[workspace]
resolver = "3"
members = ["crates/formato-video", "crates/video", "crates/corpus", "crates/core", "crates/audio", "crates/audio-saida", "crates/rom", "crates/recomp", "crates/fidelidade", "crates/web", "crates/console", "crates/teste-descompressao", "crates/teste-nucleo", "crates/teste-som", "xtask"]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false
license = "MIT"

# Lints comuns. O crate core tem tabela propria, mais rigida (ver crates/core/Cargo.toml).
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# opt-level 3 reduz o tempo do quadro Wasm de 15,46 para 8,02 ms (-48%) com ganho de 22% no tamanho (secao 3.7).
opt-level = 3
lto = true
