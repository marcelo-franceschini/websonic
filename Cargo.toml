[workspace]
resolver = "3"
members = ["crates/core", "crates/rom", "crates/web", "xtask"]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false
license = "MIT"

# Lints comuns. O crate core tem tabela propria, mais rigida (ver crates/core/Cargo.toml).
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Binario WebAssembly menor. Nao muda o comportamento.
opt-level = "s"
lto = true
